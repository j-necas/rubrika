name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  wheels:
    # Every supported platform must install the plugin's dependencies from ready-made wheels.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The plugin's lock file matches its pyproject.toml
        run: uv lock --check
        working-directory: plugin/server
      - run: python3 scripts/check_wheels.py
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e './plugin/server[dev]'
      - name: Require real MCP SDK, do not hide integration behind skipped tests
        run: python -c "import importlib.metadata; assert importlib.metadata.version('mcp') == '2.2.0'"
      - name: Parser libraries (libxml2 differs between platforms)
        run: python -c "import lxml.etree as e; print('libxml2', e.LIBXML_VERSION, 'lxml', e.LXML_VERSION)"
      - run: python -m pytest -q -ra --junitxml=test-results.xml
      - run: rubrika demo --data-dir .demo-data --output .demo-data/report.html
      - run: python scripts/build_desktop.py --output-dir dist
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            .demo-data/report.html
            dist/rubrika.mcpb
            dist/rubrika-skill.zip
